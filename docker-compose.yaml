services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      - POSTGRES_DB=summary_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=omehasan3@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - app_network
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    user: "1001:1001"
    ports:
      - "8000:8000"
     
    volumes:
      - media_data:/app/media   # persist uploads
      - ./backend/logs:/app/logs     # persist logs
      - batch_uploads:/tmp/batch_uploads  # shared temp storage for celery tasks
      # - ./media:/app/media
      # - ./logs:/app/logs
    env_file:
      - .env                         # secrets stay out of compose file
    environment:
      - DJANGO_SETTINGS_MODULE=summary_backend.settings
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=summary_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app_network
    command: ["/bin/bash", "/app/entrypoint.sh"]
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery-worker
    volumes:
      - media_data:/app/media
      - ./backend/logs:/app/logs
      - batch_uploads:/tmp/batch_uploads  # shared temp storage for celery tasks
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=summary_backend.settings
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=summary_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A summary_backend worker -l info -Q puma_summary,celery,image_processor --concurrency=4 --logfile=/app/logs/celery.log
    networks:
      - app_network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery-beat
    volumes:
      - ./backend/logs:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=summary_backend.settings
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=summary_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A summary_backend beat -l info
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:80"       # Nginx now listens on 80, not 5173
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

volumes:
  media_data:
  postgres_data:
  redis_data:
  batch_uploads:
    driver: local

networks:
  app_network:
    driver: bridge